name: Publish runbooks to GitHub Wiki

on:
  push:
    branches: [ main ]
    paths:
      - "runbooks/**"
      - ".github/workflows/wiki.yml"

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync runbooks into wiki
        run: |
          set -euo pipefail
          rsync -av --delete \
            --exclude ".git" \
            runbooks/ \
            wiki/

      - name: Generate Home.md TOC
        run: |
          set -euo pipefail
          cd wiki

          echo 'This wiki is auto-published from the main repository `runbooks/`.' >> Home.md
          echo 'It contains operator-facing and technical runbooks for event operation.' >> Home.md
          echo '' >> Home.md
          echo '## 📋 Table of Contents' >> Home.md

          # Generate TOC dynamically from markdown filenames
          find . -maxdepth 1 -type f -name "*.md" ! -name "Home.md" \
            -printf "%f\n" | sort | while read -r file; do
              page="${file%.md}"

              # Convert filename -> title:
              # photobooth_operator_runbook -> Photobooth Operator Runbook
              title="$(echo "$page" \
                | tr '_' ' ' \
                | sed -E 's/^photobooth //i; s/\b([a-z])/\U\1/g')"

              echo "- [[${title}|${page}]]" >> Home.md
          done

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          cd wiki
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git status --porcelain | grep -q .; then
            git add -A
            git commit -m "Sync runbooks from main repo (${GITHUB_SHA::7})"
            git push
          else
            echo "No wiki changes to publish."
          fi
